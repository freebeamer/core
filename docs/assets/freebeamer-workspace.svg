<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">FreeBeamer desktop development preview</title>
  <desc id="desc">A dark calibration editor with map navigation, a color-coded editable matrix, metadata, and optional visualization controls.</desc>
  <defs>
    <filter id="shadow"><feDropShadow dy="12" stdDeviation="18" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1400" height="760" fill="#0c1014"/>
